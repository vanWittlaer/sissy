name: shop-edge

services:
  traefik:
    image: traefik:v3.7.10
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Referer=keep
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Traefik creates acme.json itself (chmod 600). Just give it the directory.
      - ./data/acme:/acme
    restart: unless-stopped
    # Traefik is the internet-facing process AND holds the Docker socket (root
    # on the host, in effect — :ro does not restrict the API). This doesn't fix
    # that, but it removes the setuid escalation path from an in-container RCE.
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

networks:
  edge:
    # Shared external network; prod & stage attach to it. The key doubles as
    # the network name. Create once: docker network create edge
    external: true
