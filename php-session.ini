; One copy for both stacks. Each compose.yaml mounts it into every app
; container as /usr/local/etc/php/conf.d/zz-sissy-session.ini (zz- so it loads
; after docker-base's docker.ini and wins).
;
; docker-base ships session.gc_probability = 0: PHP never deletes expired
; session files. That only worked because every deploy threw the container
; (and its sessions) away. With data/sessions persisted, nothing else cleans
; up, and Shopware starts a session on every storefront request, bots
; included. So turn PHP's own GC back on: roughly 1 in 1000 session starts
; sweeps files idle longer than session.gc_maxlifetime, which compose sets
; from SESSION_LIFETIME via PHP_SESSION_GC_MAXLIFETIME.
session.gc_probability = 1
session.gc_divisor = 1000
