name: shop-stage

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE in .env}:${TAG:-latest}
  env_file: .env.local
  depends_on:
    database:
      condition: service_healthy
    setup:
      condition: service_completed_successfully
  restart: unless-stopped
  # See prod/compose.yaml: no setuid escalation path out of UID 82.
  security_opt:
    - no-new-privileges:true
  networks:
    - internal

# See prod/compose.yaml for why each of these is shared between web and worker,
# and why public/bundles and var/cache are deliberately absent.
x-app-volumes: &app-volumes
  - ./data/media:/var/www/html/public/media
  - ./data/thumbnail:/var/www/html/public/thumbnail
  - ./data/theme:/var/www/html/public/theme
  - ./data/sitemap:/var/www/html/public/sitemap
  - ./data/files:/var/www/html/files
  - ./data/log:/var/www/html/var/log

services:
  setup:
    <<: *app
    entrypoint: ["/var/www/html/vendor/bin/shopware-deployment-helper", "run", "-n"]
    restart: "no"
    volumes: *app-volumes
    depends_on:
      database:
        condition: service_healthy

  web:
    <<: *app
    environment:
      LOG_FILE: web
    volumes: *app-volumes
    networks:
      - internal
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      # Routers need no `.service=`: with a single service defined they attach
      # to it automatically.
      - traefik.http.routers.stage.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.stage.entrypoints=websecure
      - traefik.http.routers.stage.tls.certresolver=le
      - traefik.http.routers.stage.middlewares=stage-auth,stage-hsts
      - traefik.http.services.stage.loadbalancer.server.port=8000
      # HSTS — see prod/compose.yaml.
      - traefik.http.middlewares.stage-hsts.headers.stsSeconds=31536000
      # BASIC_AUTH htpasswd hashes contain '$' — they MUST be doubled to '$$'
      # in the .env value or compose interpolation eats them and auth fails.
      - traefik.http.middlewares.stage-auth.basicauth.users=${BASIC_AUTH}
      # /api is exempt: the admin sends `Authorization: Bearer`, which replaces
      # the Basic credentials, so basicauth 401s and the browser re-prompts
      # forever. Shopware's OAuth guards /api on its own.
      - traefik.http.routers.stage-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.stage-api.priority=100
      - traefik.http.routers.stage-api.entrypoints=websecure
      - traefik.http.routers.stage-api.tls.certresolver=le
      - traefik.http.routers.stage-api.middlewares=stage-hsts
      # /media and /thumbnail are exempt too: dompdf inside `web` fetches
      # document logos and product images by their public URL, and cannot
      # answer basic-auth, so every PDF rendered on stage came out imageless.
      # Same files prod serves anonymously (stage's media is prod's copy);
      # files/ (invoices, exports) is not under these prefixes and stays gated.
      - traefik.http.routers.stage-media.rule=Host(`${DOMAIN}`) && (PathPrefix(`/media`) || PathPrefix(`/thumbnail`))
      - traefik.http.routers.stage-media.priority=100
      - traefik.http.routers.stage-media.entrypoints=websecure
      - traefik.http.routers.stage-media.tls.certresolver=le
      - traefik.http.routers.stage-media.middlewares=stage-hsts
      # Password recovery is 404 on stage. refresh-stage.sh copies prod's
      # users in, and /api/_action/user/user-recovery is unauthenticated by
      # design AND bypasses basic-auth via stage-api above — so anyone could
      # request a reset for a real admin login and read the link in Mailpit.
      # Rewriting to a path Shopware doesn't route makes it render its own
      # 404 (no extra container; noop@internal would answer 418). Priority
      # beats stage-api so the /api prefix is caught too. Proxy-level only:
      # console commands and future recovery routes are not covered.
      - traefik.http.routers.stage-norecover.rule=Host(`${DOMAIN}`) && (PathPrefix(`/account/recover`) || PathPrefix(`/api/_action/user/user-recovery`))
      - traefik.http.routers.stage-norecover.priority=200
      - traefik.http.routers.stage-norecover.entrypoints=websecure
      - traefik.http.routers.stage-norecover.tls.certresolver=le
      - traefik.http.routers.stage-norecover.middlewares=stage-norecover,stage-hsts
      - traefik.http.middlewares.stage-norecover.replacepath.path=/__recovery-disabled

  worker:
    <<: *app
    # Single worker on stage — it shares the box with prod.
    # See prod/compose.yaml for why `webhook` is absent until Shopware 6.8.
    entrypoint: ["php", "bin/console", "messenger:consume", "async", "low_priority", "--time-limit=300", "--memory-limit=512M"]
    environment:
      LOG_FILE: worker
    volumes: *app-volumes
    # Serves no HTTP, so the image's web healthcheck can only fail — see
    # prod/compose.yaml for why it is disabled rather than replaced.
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    entrypoint: ["php", "bin/console", "scheduled-task:run"]
    environment:
      LOG_FILE: scheduler
    volumes:
      - ./data/log:/var/www/html/var/log
    healthcheck:
      disable: true

  database:
    # Overridable per host via MARIADB_VERSION in .env — stage may run ahead of
    # prod on purpose, to rehearse a DB upgrade before prod takes it. The image
    # does NOT upgrade an existing data dir on its own — after raising the
    # version, run mariadb-upgrade in the container (or set
    # MARIADB_AUTO_UPGRADE=1 for one start).
    image: mariadb:${MARIADB_VERSION:-11.8}
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_DATABASE: shopware
      MARIADB_USER: shopware
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/conf.d/99-sissy.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - internal

  # Catches everything stage sends (MAILER_DSN=smtp://mailpit:1025 in
  # .env.local) instead of delivering it. Mail lives in memory and dies with
  # the container — on stage that is a feature. The UI needs a DNS A-record
  # for mailpit.${DOMAIN}; Let's Encrypt validates each host separately.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.stage-mail.rule=Host(`mailpit.${DOMAIN}`)
      - traefik.http.routers.stage-mail.entrypoints=websecure
      - traefik.http.routers.stage-mail.tls.certresolver=le
      # No stage-auth here: the UI shows every captured mail (password resets
      # included), so it is guarded by Mailpit's OWN basic-auth below — the
      # mailbox credentials are independent of the storefront's BASIC_AUTH,
      # and the guard survives even if this router's middlewares change.
      - traefik.http.routers.stage-mail.middlewares=stage-hsts
      - traefik.http.services.stage-mail.loadbalancer.server.port=8025
    environment:
      # htpasswd file (bcrypt/apr1/sha/plain all accepted). A FILE, not
      # MP_UI_AUTH=${...}: the hash never passes through compose interpolation,
      # so no '$$' doubling — a single '$' is correct there. Covers UI + its
      # API on :8025; SMTP on :1025 stays open on `internal`, as intended.
      MP_UI_AUTH_FILE: /mailpit.htpasswd
    volumes:
      # Bind-mounted single file: must exist before `up` or Docker creates a
      # directory and Mailpit refuses to start. bootstrap.sh checks for it.
      - ./mailpit.htpasswd:/mailpit.htpasswd:ro

networks:
  internal:
  edge:
    external: true
