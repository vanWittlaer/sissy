name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # Defaults are this repo's layout, so callers using it pass neither.
      # Both resolve against the CALLER's checkout, not sissy's.
      context:
        description: Build context — the Shopware app directory.
        type: string
        default: ./shopware
      dockerfile:
        description: Dockerfile path, relative to the repo root.
        type: string
        default: ./shopware/docker/Dockerfile
      legacy_token_build_arg:
        description: >-
          Also pass the packages token as build-arg SHOPWARE_PACKAGES_TOKEN.
          Only needed by hand-written Dockerfiles that declare that ARG — and
          it bakes the token into the pushed image's history, so set this to
          false as soon as the Dockerfile reads the BuildKit secret instead.
        type: boolean
        default: true
    secrets:
      BEARER_PACKAGES_SHOPWARE:
        required: false
      COMPOSER_AUTH:
        # Whole auth.json, mounted as the BuildKit secret `composer_auth` --
        # the id the recipe's Dockerfile already mounts at /src/auth.json.
        # For a project whose composer.json reaches a private VCS repo or a
        # second registry, where one bearer token isn't enough. Left unset,
        # nothing is mounted and composer sees no auth.json at all -- which is
        # not the same as mounting an empty one, so the conditional below is
        # load-bearing: empty auth.json is invalid JSON and composer aborts.
        required: false
    outputs:
      tag:
        description: Immutable tag that was pushed — what deploy.sh should pull.
        value: ${{ jobs.build.outputs.tag }}

env:
  # ONE image for every environment. prod and stage differ by tag, not by
  # repository, so promoting a build is just deploying an existing tag.
  # Derived from the repo, so a project built on sissy needs no edit here -- it
  # must match APP_IMAGE in each stack's .env on the host. Only ever consumed by
  # metadata-action below, which lowercases it; GHCR rejects uppercase.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per build: a moving pointer per environment (latest / stage)
      # for humans, and the commit SHA that deploys actually pull.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.environment == 'prod' && 'latest' || 'stage' }}
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            io.sissy.environment=${{ inputs.environment }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The recipe's own Dockerfile (shopware/docker 0.3) takes the token
          # as `ARG SHOPWARE_PACKAGES_TOKEN`, which is why the build-arg below
          # still defaults on. A project that would rather not bake it into
          # image history swaps that ARG for `--mount=type=secret,id=
          # packages_token,env=SHOPWARE_PACKAGES_TOKEN` -- same env var, same
          # entrypoint -- and passes legacy_token_build_arg: false. That form
          # needs dockerfile frontend >= 1.10, so bump the syntax directive
          # too. The mount id, not the env name, is what must match here.
          secrets: |
            packages_token=${{ secrets.BEARER_PACKAGES_SHOPWARE }}
          # Via secret-envs, not `secrets:`, because auth.json is multi-line
          # JSON full of quotes -- inlining it into the KEY=VALUE list would
          # break that list's CSV parsing. The env below feeds it instead.
          secret-envs: ${{ secrets.COMPOSER_AUTH != '' && 'composer_auth=COMPOSER_AUTH' || '' }}
          # Kept (behind an input, default on) for projects whose hand-written
          # Dockerfile declares `ARG SHOPWARE_PACKAGES_TOKEN`; dropping it
          # outright would break them mid-v1. Prefer the secret above and pass
          # legacy_token_build_arg: false — build-args are baked into image
          # history, which is why the recipe stopped using one. Default to
          # false (or drop entirely) in v2.
          build-args: |-
            ${{ inputs.legacy_token_build_arg && format('SHOPWARE_PACKAGES_TOKEN={0}', secrets.BEARER_PACKAGES_SHOPWARE) || '' }}
