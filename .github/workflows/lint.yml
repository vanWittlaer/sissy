name: Lint

# Guards the platform half. Once other projects pin @v1, a bad ${VAR:?} or a
# broken script reaches THEIR hosts, not just ours.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Preinstalled on the runner image; no action dependency needed.
      - run: shellcheck ./*.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate every stack against its own examples
        run: |
          set -euo pipefail
          for stack in edge prod stage; do
            # The examples are the fixture: a compose file that grows a new
            # ${VAR:?} without a matching .env.example line fails right here
            # instead of on a host. env_file must exist too, or config errors.
            for f in .env .env.local; do
              if [ -f "$stack/$f.example" ]; then cp "$stack/$f.example" "$stack/$f"; fi
            done
            echo "==> $stack"
            docker compose -f "$stack/compose.yaml" config -q
          done
